{% extends 'base.html' %}
{% block title %}Admin MFA Verify | Cherokee Bowling{% endblock %}
{% block content %}
<section class="card narrow">
    <h2>Verify admin MFA</h2>
    <p>Enter a current code from your authenticator app to continue into admin.</p>
    <form method="post" class="form-grid">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Verify</button>
    </form>
</section>
{% endblock %}
