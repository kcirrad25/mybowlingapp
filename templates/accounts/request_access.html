{% extends 'base.html' %}
{% block title %}Request Access | Cherokee Bowling{% endblock %}
{% block content %}
<section class="card narrow">
    <h2>Request website access</h2>
    <p>If you are not yet authorized, submit this form for admin review.</p>
    <form method="post" class="form-grid">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit request</button>
    </form>
</section>
{% endblock %}
