# Cherokee Bowling League - nginx configuration
# Place this at: /etc/nginx/conf.d/cherokee-bowling.conf

server {
    listen 80;

    # -------------------------------------------------------
    # REPLACE the line below with your EC2 Public IP address
    # OR your domain name once you have one
    # Example with IP:     server_name 54.23.187.45;
    # Example with domain: server_name cherokeebowling.com www.cherokeebowling.com;
    # -------------------------------------------------------
    server_name YOUR_EC2_PUBLIC_IP;

    # Uploaded files (logos, PDFs) served directly from local disk
    # If you enable S3, Django serves these from S3 instead and this block is unused
    location /media/ {
        alias /home/ec2-user/cherokeebowling/media/;
    }

    # Static files (CSS, JS) served directly by nginx - very fast
    location /static/ {
        alias /home/ec2-user/cherokeebowling/staticfiles/;
    }

    # Everything else goes to Django via gunicorn
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20M;
    }

    # Hide nginx version from error pages
    server_tokens off;
}
